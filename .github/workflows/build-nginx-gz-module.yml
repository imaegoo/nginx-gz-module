name: Build Nginx with GZip Module (ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libpcre3-dev zlib1g-dev libssl-dev

      - name: Download nginx 1.22.1 source
        run: |
          wget https://nginx.org/download/nginx-1.22.1.tar.gz
          tar xzf nginx-1.22.1.tar.gz

      - name: Configure and build nginx
        run: |
          cd nginx-1.22.1
          ./configure \
            --prefix=$GITHUB_WORKSPACE/nginx-install \
            --with-http_ssl_module \
            --with-http_gzip_static_module \
            --with-http_gunzip_module
          make -j$(nproc)
          make install

      - name: Verify gzip module
        run: $GITHUB_WORKSPACE/nginx-install/sbin/nginx -V 2>&1 | tr ' ' '\n' | grep -i gzip

      - name: Package nginx
        run: |
          cd $GITHUB_WORKSPACE/nginx-install
          tar czf $GITHUB_WORKSPACE/nginx-1.22.1-arm64.tar.gz .

      - name: Upload nginx artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-1.22.1-arm64
          path: nginx-1.22.1-arm64.tar.gz
